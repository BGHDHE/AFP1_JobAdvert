<link rel="stylesheet" href="./applicant-jobs.css">
<div class="navigation"><button class="profile" routerLink="/felhasznaloprofil">Profil</button><button class="return" routerLink="/searchjobs">Vissza</button></div>
<h2 class="jobs">Állásaid</h2>

<div *ngIf="loading">Betöltés...</div>
<div *ngIf="!loading && error">{{ error }}</div>
<div *ngIf="!loading && jobs.length === 0 && !error">Még nem jelentkeztél egy állásra sem.</div>

<div class="jobs-container" *ngFor="let job of jobs">
  <h3 class="job_name">{{ job.title }}</h3>
  <p class="job_details"><strong>Cég:</strong> {{ job.company }}</p>
  <p class="job_details"><strong>Helyszín:</strong> {{ job.location }}</p>
  <p class="job_details"><strong>Bér:</strong> {{ job.salary }}</p>
  <p class="job_details"><strong>Leírás:</strong> {{ job.description }}</p>

  <div class="controls">
    <button class="dropout" (click)="withdrawApplication(job.id)">Lejelentkezés</button>
    <p class="status">Állapot: {{ job.status || 'Függőben' }}</p>
  </div>
</div>
